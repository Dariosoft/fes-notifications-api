spring:
  application:
    name: notifications-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/notifications}
    username: ${DATABASE_USERNAME:notifications}
    password: ${DATABASE_PASSWORD:notifications-local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: latest
      enable-auto-commit: false
    listener:
      ack-mode: record
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:app}
    password: ${RABBITMQ_PASSWORD:app-local}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:friendly}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
app:
  feed:
    replay-size: 100
    timeout-ms: 1800000
